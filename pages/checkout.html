<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BADSON</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="site-header">

    <button class="icon-button burger-button" type="button" aria-label="Открыть меню" aria-expanded="false"
      aria-controls="side-menu">

      <span class="dot-grid">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>

    </button>

    <a class="icon-button cart-button" type="button" aria-label="Корзина" href="./cart.html">

      <img alt="" decoding="async" height="28" loading="eager"
        src="https://cdn.shopify.com/oxygen-v2/39987/33188/69516/2680914/assets/bag-CUGW3ICK.avif?width=28&amp;height=28&amp;crop=center"
        srcset="https://cdn.shopify.com/oxygen-v2/39987/33188/69516/2680914/assets/bag-CUGW3ICK.avif?width=28&amp;height=28&amp;crop=center 1x, https://cdn.shopify.com/oxygen-v2/39987/33188/69516/2680914/assets/bag-CUGW3ICK.avif?width=56&amp;height=56&amp;crop=center 2x, https://cdn.shopify.com/oxygen-v2/39987/33188/69516/2680914/assets/bag-CUGW3ICK.avif?width=84&amp;height=84&amp;crop=center 3x"
        width="28" style="aspect-ratio:1/1" class="cart-icon">
      <span class="cart-badge" data-cart-badge></span>
    </a>

  </header>

  <div class="menu-overlay" data-menu-overlay></div>

  <aside class="side-menu" id="side-menu" aria-hidden="true">
    <nav class="side-menu__content">
      <a href="../index.html">Home</a>
      <a href="../index.html">Core</a>
      <a href="./info.html">Info</a>
      <a href="#">Order status</a>
    </nav>
  </aside>

  <main class="checkout-page">
    <div class="checkout-page__grid">
      <section class="checkout-page__left">
        <div class="checkout-page__inner">
          <div>
            <div class="checkout-page__express-title">Express checkout</div>

            <div class="checkout-page__express-row">
              <button class="checkout-page__express-btn" type="button">Shop</button>
              <button class="checkout-page__express-btn" type="button">PayPal</button>
              <button class="checkout-page__express-btn" type="button">G Pay</button>
            </div>

            <div class="checkout-page__or">
              <span></span>
              <div>OR</div>
              <span></span>
            </div>
          </div>

          <form id="checkoutForm" novalidate>

            <div class="checkout-block">
              <div class="checkout-block__head">
                <div class="checkout-block__title">Contact</div>
                <a class="checkout-block__link" href="#">Sign in</a>
              </div>

              <label class="field">
                <span class="field__label">Email</span>
                <input class="field__input" type="email" placeholder="Email" data-field="email" autocomplete="email" />
              </label>

              <label class="check">
                <input type="checkbox" checked />
                <span>Email me with news and offers</span>
              </label>
            </div>

            <div class="checkout-block">
              <div class="checkout-block__head">
                <div class="checkout-block__title">Delivery</div>
              </div>

              <label class="field">
                <span class="field__label">Country/Region</span>
                <select class="field__input" data-country-select data-field="country">
                  <option>United States</option>
                  <option>Canada</option>
                  <option>France</option>
                  <option>Germany</option>
                  <option>Spain</option>
                  <option>Italy</option>
                  <option>China</option>
                  <option>Japan</option>
                  <option>South Korea</option>
                  <option>United Kingdom</option>
                  <option>Australia</option>
                  <option>New Zealand</option>
                </select>
              </label>

              <div class="row2">
                <label class="field">
                  <span class="field__label">First name</span>
                  <input class="field__input" type="text" placeholder="First name" data-field="firstName"
                    autocomplete="given-name" />
                </label>

                <label class="field">
                  <span class="field__label">Last name</span>
                  <input class="field__input" type="text" placeholder="Last name" data-field="lastName"
                    autocomplete="family-name" />
                </label>
              </div>

              <label class="field">
                <span class="field__label">Address</span>
                <input class="field__input" type="text" placeholder="Address" data-field="address1"
                  autocomplete="address-line1" />
              </label>

              <label class="field">
                <span class="field__label">Apartment, suite, etc. (optional)</span>
                <input class="field__input" type="text" placeholder="Apartment, suite, etc. (optional)"
                  data-field="address2" autocomplete="address-line2" />
              </label>

              <div class="row3">
                <label class="field">
                  <span class="field__label">City</span>
                  <input class="field__input" type="text" placeholder="City" data-field="city"
                    autocomplete="address-level2" />
                </label>

                <label class="field">
                  <span class="field__label">State</span>
                  <select class="field__input" data-field="state" autocomplete="address-level1">
                    <option value="">State</option>
                    <option>CA</option>
                    <option>NY</option>
                    <option>TX</option>
                  </select>
                </label>

                <label class="field">
                  <span class="field__label">ZIP code</span>
                  <input class="field__input" type="text" placeholder="ZIP code" data-field="zip"
                    autocomplete="postal-code" />
                </label>
              </div>

              <label class="field">
                <span class="field__label">Phone</span>
                <input class="field__input" type="tel" placeholder="Phone" data-field="phone" autocomplete="tel" />
              </label>
            </div>

            <div class="checkout-block">
              <div class="checkout-block__head">
                <div class="checkout-block__title">Payment</div>
              </div>

              <div class="checkout-note">All transactions are secure and encrypted.</div>

              <div class="paybox">
                <label class="radio">
                  <input type="radio" name="pay" checked />
                  <span>Credit card</span>
                </label>

                <label class="field">
                  <span class="field__label">Card number</span>
                  <input class="field__input" type="text" placeholder="Card number" data-field="cardNumber"
                    inputmode="numeric" autocomplete="cc-number" />
                </label>

                <div class="row2">
                  <label class="field">
                    <span class="field__label">Expiration date (MM / YY)</span>
                    <input class="field__input" type="text" placeholder="MM / YY" data-field="cardExp"
                      inputmode="numeric" autocomplete="cc-exp" />
                  </label>

                  <label class="field">
                    <span class="field__label">Security code</span>
                    <input class="field__input" type="text" placeholder="Security code" data-field="cardCvc"
                      inputmode="numeric" autocomplete="cc-csc" />
                  </label>
                </div>

                <label class="field">
                  <span class="field__label">Name on card</span>
                  <input class="field__input" type="text" placeholder="Name on card" data-field="cardName"
                    autocomplete="cc-name" />
                </label>

                <label class="check">
                  <input type="checkbox" checked />
                  <span>Use shipping address as billing address</span>
                </label>

                <label class="radio radio--muted">
                  <input type="radio" name="pay" />
                  <span>Shop Pay · Pay in full or in installments</span>
                </label>

                <label class="radio radio--muted">
                  <input type="radio" name="pay" />
                  <span>PayPal</span>
                </label>
              </div>

              <div class="checkout-block__foot">
                <button class="paynow" type="submit">Pay now</button>
              </div>
            </div>

            <div class="checkout-block">
              <div class="checkout-block__head">
                <div class="checkout-block__title">Remember me</div>
              </div>

              <label class="check">
                <input type="checkbox" />
                <span>Save my information for a faster checkout</span>
              </label>
            </div>

          </form>
        </div>
      </section>

      <aside class="checkout-page__right" aria-label="Order summary">
        <div class="checkout-page__summary" id="checkoutSummary"></div>
      </aside>
    </div>
  </main>


  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-left footer-col">

        <div class="currency-select" data-currency>
          <button class="currency-select__btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="currency-select__value" data-currency-value>US (USD $)</span>

            <svg class="currency-select__chev" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>

          <div class="currency-select__menu" role="listbox" tabindex="-1" aria-label="Currency list">
            <button class="currency-select__opt is-selected" role="option" type="button" data-value="US (USD $)"
              aria-selected="true">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">US (USD $)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Canada - French (CAD $)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Canada - French (CAD $)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Canada - English (CAD $)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Canada - English (CAD $)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="France (EUR €)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">France (EUR €)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Germany (EUR €)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Germany (EUR €)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Spain (EUR €)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Spain (EUR €)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Italy (EUR €)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Italy (EUR €)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="China (CNY ¥)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">China (CNY ¥)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Japan (JPY ¥)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Japan (JPY ¥)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="South Korea (KRW ₩)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">South Korea (KRW ₩)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="United Kingdom (GBP £)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">United Kingdom (GBP £)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="Australia (AUD $)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">Australia (AUD $)</span>
            </button>

            <button class="currency-select__opt" role="option" type="button" data-value="New Zealand (NZD $)"
              aria-selected="false">
              <span class="currency-select__check" aria-hidden="true">✓</span>
              <span class="currency-select__text">New Zealand (NZD $)</span>
            </button>
          </div>
        </div>

      </div>

      <div class="footer-center footer-col">

        <p>© 2025, <a href="https://badson.us/">BAD SON</a></p>
      </div>


      <div class="footer-right footer-col">

        <ul class="pay">

          <li>VISA</li>
          <li>DISCOVER</li>
          <li>SHOPIFY</li>
          <li>APPLE</li>

        </ul>

      </div>

    </div>
  </footer>

  <script type="module" src="../scripts/checkout-page.js"></script>
  <script type="module" src="../scripts/checkout-form.js"></script>
  <script src="../scripts/currency.js"></script>
  <script src="../scripts/footer-select.js"></script>
  <script src="../scripts/script.js"></script>
  <script type="module" src="../scripts/order-success.js"></script>
  <script type="module" src="../scripts/cart-badge.js"></script>
</body>

</html>
